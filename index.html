        function spotifySearchUrl(query) {

        // 渲染卡片函數
        function renderCards(groupsToRender) {
            const grid = document.getElementById('groups-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = ''; // 清空現有卡片

            if (groupsToRender.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            groupsToRender.forEach(group => {
                const card = document.createElement('div');
                card.className = 'group bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 card-hover flex flex-col h-full';

                // 動態生成帶有原創幾何圖樣的卡片頭部（取代真實封面圖，避免版權問題）
                card.innerHTML = `
                    <div class="h-40 bg-slate-900 flex items-center justify-center relative overflow-hidden">
                        <!-- 原創幾何圖樣背景 -->
                        <div class="cover-pattern absolute inset-0" style="background-image: ${group.background}; background-size: ${group.bgSize};"></div>
                        <!-- 漸層疊加，確保團名文字清晰可讀 -->
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent opacity-90"></div>

                        <h3 class="text-3xl font-black text-white text-center tracking-wider drop-shadow-xl z-10 break-words relative transform transition duration-500 group-hover:scale-105">${group.name}</h3>
                    </div>

                    <div class="p-5 flex-grow flex flex-col">
                        <div class="flex justify-between items-start mb-3">
                            <span class="inline-block px-2 py-1 bg-slate-700 text-pink-400 text-xs font-semibold rounded uppercase tracking-wide">
                                ${group.gen}
                            </span>
                            <span class="text-xs text-slate-400 font-medium bg-slate-900 px-2 py-1 rounded">${group.agency}</span>
                        </div>

                        <div class="mb-4">
                            <span class="text-sm font-bold text-slate-200 block mb-1">主打概念：</span>
                            <p class="text-purple-300 text-sm font-medium">${group.concept}</p>
                        </div>

                        <div class="mb-4 flex-grow">
                            <p class="text-slate-400 text-sm line-clamp-3">${group.description}</p>
                        </div>

                        <div class="mt-auto border-t border-slate-700 pt-3">
                            <span class="text-xs text-slate-400 mb-2 block">熱門歌曲：</span>
                            <div class="flex flex-wrap gap-2 mb-3">
                                ${group.songs.map(song => `<span class="text-xs bg-slate-700 text-slate-200 px-2 py-1 rounded shadow-sm border border-slate-600">${song}</span>`).join('')}
                            </div>
                            <a href="${spotifySearchUrl(group.officialQuery)}" target="_blank" rel="noopener" class="official-link">
                                查看官方封面 (Spotify) ↗
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 篩選功能
        function filterGroups(gen) {
            // 更新按鈕樣式
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.dataset.gen === gen) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300');
                    btn.classList.add('bg-pink-600', 'text-white');
                } else {
                    btn.classList.remove('bg-pink-600', 'text-white');
                    btn.classList.add('bg-slate-800', 'text-slate-300');
                }
            });

            // 執行篩選
            if (gen === 'all') {
                renderCards(kpopGroups);
            } else {
                const filtered = kpopGroups.filter(group => group.gen === gen);
                renderCards(filtered);
            }
        }

        // 隨機推薦功能 (驚喜推薦)
        function showRandomRecommendation() {
            const randomIndex = Math.floor(Math.random() * kpopGroups.length);
            const group = kpopGroups[randomIndex];

            // 填充模態框資料
            const modalImageContainer = document.getElementById('modal-image-container');

            // 設置原創幾何圖樣背景
            modalImageContainer.style.backgroundImage = group.background;
            modalImageContainer.style.backgroundSize = group.bgSize;

            document.getElementById('modal-group-name').textContent = group.name;
            document.getElementById('modal-group-gen').textContent = `${group.gen}女團`;
            document.getElementById('modal-group-agency').textContent = group.agency;
            document.getElementById('modal-group-desc').textContent = group.description;
            document.getElementById('modal-official-link').href = spotifySearchUrl(group.officialQuery);

            // 生成歌曲列表
            const songsList = document.getElementById('modal-group-songs');
            songsList.innerHTML = '';
            group.songs.forEach(song => {
                const li = document.createElement('li');
                li.className = 'flex items-center gap-2 text-slate-300 bg-slate-900 bg-opacity-50 p-2 rounded-lg';
                li.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-pink-500 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z" />
                    </svg>
                    <span>${song}</span>
                `;
                songsList.appendChild(li);
            });

            // 顯示模態框 (帶動畫效果)
            const modal = document.getElementById('recommendation-modal');
            const modalContent = document.getElementById('modal-content-box');

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // 觸發重繪以應用動畫
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        // 關閉模態框
        function closeModal() {
            const modal = document.getElementById('recommendation-modal');
            const modalContent = document.getElementById('modal-content-box');

            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            // 等待動畫完成後隱藏
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        // 點擊模態框背景關閉
        document.getElementById('recommendation-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 頁面載入完成後初始化渲染
        window.addEventListener('DOMContentLoaded', () => {
            renderCards(kpopGroups);
        });

        // ---------- PWA: Service Worker 註冊 ----------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker 註冊成功:', reg.scope))
                    .catch(err => console.error('Service Worker 註冊失敗:', err));
            });
        }

        // ---------- PWA: 安裝提示按鈕 ----------
        let deferredInstallPrompt = null;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            installBtn.classList.add('visible');
        });

        function installApp() {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.finally(() => {
                deferredInstallPrompt = null;
                installBtn.classList.remove('visible');
            });
        }

        window.addEventListener('appinstalled', () => {
            installBtn.classList.remove('visible');
        });

        // ---------- PWA: 離線狀態提示 Banner ----------
        const offlineBanner = document.getElementById('offline-banner');
        function updateOnlineStatus() {
            if (navigator.onLine) {
                offlineBanner.classList.add('hidden');
            } else {
                offlineBanner.classList.remove('hidden');
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
    </script>
</body>
</html>
